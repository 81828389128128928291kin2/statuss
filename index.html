            background: #4ade80;

            border-radius: 10px;

            font-size: 0.9rem;
            color: #a1a1aa;

        .support-banner .highlight {

        }

        .controls {

            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            margin-bottom: 2rem;

            border: 1px solid #1a1a2a;
            border-radius: 8px;
            padding: 0.6rem 1rem;
            color: #e4e4e7;
            font-size: 0.9rem;

        .controls .search-box:focus {

        }

        .controls .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .controls .filter-group button {

            border: 1px solid #1a1a2a;
            color: #a1a1aa;
            padding: 0.35rem 1rem;
            border-radius: 100px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;

        .controls .filter-group button:hover {

            color: #f4f4f5;
        }

        .controls .filter-group button.active {
            background: #2a2a4a;
            border-color: #a855f7;
            color: #f4f4f5;
        }

        .controls .refresh-btn {
            background: #12121e;
            border: 1px solid #1a1a2a;
            color: #a1a1aa;
            padding: 0.35rem 1.25rem;
            border-radius: 100px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: 0.15s;

            color: #f4f4f5;

            font-size: 0.7rem;
            color: #4a4a5a;

            font-size: 0.6rem;

            height: 6px;

            0% { opacity: 1; }

            100% { opacity: 1; }

            align-items: center;

            padding: 4rem 0;

            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;

            background: #3a3a5a;

        @media (max-width: 768px) {

                align-items: flex-start;

            .executor-card .card-header .status-badge {
                margin-left: 0;

            .executor-card .card-footer {

                align-items: stretch;
                gap: 0.5rem;

                discordlink: "https://discord.com/invite/olemad",
                keysystem: true,
                logo: "https://cdn.weao.gg/slug/madium/logo.png"
            }, {
                title: "Velocity",
                version: "1.3.6",
                free: true,
                updateStatus: true,
                platform: "Windows",
                cost: "Free (Key)",
                description: "Velocity focuses on stability and speed for advanced scripters.",
                developer: "CG",
                downloads: "1.2K",
                websitelink: "https://realvelocity.xyz/",
                discordlink: "https://discord.com/invite/velocityide",
                keysystem: true,
                logo: "https://cdn.weao.gg/slug/velocity/logo.png"
            }, {
                title: "Delta",
                version: "2.729.840",
                free: true,
                updateStatus: true,
                platform: "Android",
                cost: "Free (Key)",
                description: "The most popular executor for Android users.",
                developer: "lxnny, mlemix",
                downloads: "15.4K",
                websitelink: "https://deltaexploits.gg/",
                discordlink: "https://discord.gg/deltax",
                keysystem: true,
                logo: "https://cdn.weao.gg/slug/delta/logo.png"
            }];

            function isUp(exec) {
                return exec.updateStatus === true;
            }

            function isFree(exec) {
                return exec.free === true;
            }

            function isPaid(exec) {
                return exec.free === false;
            }

            function hasKeySystem(exec) {
                return exec.keysystem === true;
            }

            function getLogoUrl(title) {
                return LOGO_MAP[title] || null;
            }

            function getPurchaseLink(title) {
                return PURCHASE_LINKS[title] || null;
            }

            function renderCard(exec) {
                const card = document.createElement('div');
                card.className = 'executor-card';

                const isUpStatus = isUp(exec);
                const statusClass = isUpStatus ? 'up' : 'down';
                const statusIcon = isUpStatus ?
                    `<span class="check-icon"></span>` :
                    `<span class="x-icon"></span>`;
                const statusTextLabel = isUpStatus ? 'Up' : 'Down';
                const priceClass = isFree(exec) ? 'free' : (hasKeySystem(exec) ? 'keysystem' : '');

                const logoUrl = exec.logo || getLogoUrl(exec.title);
                const isWindows = exec.platform && exec.platform.toLowerCase() === 'windows';
                const isAndroid = exec.platform && exec.platform.toLowerCase() === 'android';

                let platformIcon = '🖥️';
                if (isWindows) platformIcon = `<img src="${WINDOWS_LOGO}" alt="Windows" class="platform-icon" />`;
                else if (isAndroid) platformIcon = `<img src="${ANDROID_LOGO}" alt="Android" class="platform-icon" />`;

                let priceDisplay = exec.cost || '—';
                if (hasKeySystem(exec) && !isFree(exec)) {
                    priceDisplay = '🔑 ' + priceDisplay;
                } else if (hasKeySystem(exec) && isFree(exec)) {
                    priceDisplay = '🔑 Free';
                }

                let linksHtml = '';
                if (exec.websitelink) linksHtml += `<a href="${exec.websitelink}" target="_blank">🌐</a>`;
                if (exec.discordlink) linksHtml += `<a href="${exec.discordlink}" target="_blank" class="discord"><img src="${DISCORD_LOGO}" alt="Discord" class="discord-img" /></a>`;

                const purchaseLink = getPurchaseLink(exec.title);
                if (purchaseLink && !isFree(exec)) {
                    linksHtml += `<a href="${purchaseLink}" target="_blank">🛒</a>`;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <div class="logo-section">
                            <div class="logo">
                                ${logoUrl ? `<img src="${logoUrl}" alt="${exec.title} logo" onerror="this.style.display='none';this.parentElement.textContent=''" />` : ''}
                            </div>
                            <div class="name-section">
                                <span class="name">${exec.title}</span>
                                <span class="version">${exec.version || ''}</span>
                            </div>
                        </div>
                        <span class="status-badge ${statusClass}">${statusIcon} ${statusTextLabel}</span>
                    </div>
                    <div class="developer">
                        <strong>Developer:</strong> ${exec.developer || 'Unknown'}
                    </div>
                    <div class="description">
                        ${exec.description || 'No description available.'}
                    </div>
                    <div class="card-footer">
                        <div class="platform">
                            ${platformIcon}
                            ${exec.platform || 'Windows'}
                        </div>
                        <div class="downloads">
                            ⬇ ${exec.downloads || '0'} downloads
                        </div>
                        <div class="price ${priceClass}">
                            ${priceDisplay}
                        </div>
                        <div style="display:flex; gap:0.4rem; align-items:center;">
                            <div class="action-links">${linksHtml}</div>
                            <span class="tracking-badge">
                                <span class="live-dot"></span> Live
                            </span>
                        </div>
                    </div>
                `;

                return card;
            }

            function render(execs, filter, search) {
                let filtered = [...execs];

                if (filter === 'free') filtered = filtered.filter(e => isFree(e));
                else if (filter === 'paid') filtered = filtered.filter(e => isPaid(e));
                else if (filter === 'up') filtered = filtered.filter(e => isUp(e));

                if (search.trim()) {
                    const term = search.toLowerCase().trim();
                    filtered = filtered.filter(e =>
                        e.title.toLowerCase().includes(term) ||
                        (e.version && e.version.toLowerCase().includes(term)) ||
                        (e.platform && e.platform.toLowerCase().includes(term)) ||
                        (e.developer && e.developer.toLowerCase().includes(term))
                    );
                }

                grid.innerHTML = '';
                if (filtered.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column:1/-1;text-align:center;color:#71717a;padding:3rem;">
                            No executors match your criteria.
                        </div>
                    `;
                    return;
                }

                filtered.forEach(e => {
                    grid.appendChild(renderCard(e));
                });
            }

            async function fetchExploits() {
                if (isFetching) return;
                isFetching = true;

                try {
                    const proxyUrl = 'https://api.allorigins.win/raw?url=';
                    const apiUrl = 'https://weao.xyz/api/status/exploits';

                    const response = await fetch(proxyUrl + encodeURIComponent(apiUrl), {
                        signal: AbortSignal.timeout(10000)
                    });

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();

                    if (!Array.isArray(data) || data.length === 0) {
                        throw new Error('No data received');
                    }

                    const filteredData = data
                        .filter(e => KEEP_EXECUTORS.includes(e.title) && e.platform !== 'iOS')
                        .map(e => {
                            return {
                                title: e.title,
                                version: e.version || '—',
                                free: e.free === true,
                                updateStatus: e.updateStatus === true,
                                platform: e.platform || 'Windows',
                                cost: e.cost || '—',
                                description: STATIC_DESCRIPTIONS[e.title] || 'No description available.',
                                developer: STATIC_DEVELOPERS[e.title] || 'Unknown',
                                downloads: STATIC_DOWNLOADS[e.title] || '0',
                                websitelink: e.websitelink || null,
                                discordlink: e.discordlink || null,
                                logo: LOGO_MAP[e.title] || null,
                                keysystem: e.keysystem === true
                            };
                        });

                    if (filteredData.length > 0) {
                        allExecutors = filteredData;
                    } else {
                        allExecutors = FALLBACK_DATA;
                    }

                    render(allExecutors, currentFilter, searchBox.value);
                    statusDot.className = 'dot';
                    statusText.textContent = 'Live';
                    fetchStatus.textContent = `✓ ${allExecutors.length} executors`;

                } catch (error) {
                    console.warn('API failed, using fallback:', error.message);
                    allExecutors = FALLBACK_DATA;
                    render(allExecutors, currentFilter, searchBox.value);
                    statusDot.className = 'dot';
                    statusText.textContent = 'Live';
                    fetchStatus.textContent = `✓ ${allExecutors.length} executors`;

                } finally {
                    isFetching = false;
                }
            }

            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    if (allExecutors.length > 0) {
                        render(allExecutors, currentFilter, searchBox.value);
                    }
                });
            });

            searchBox.addEventListener('input', function() {
                if (allExecutors.length > 0) {
                    render(allExecutors, currentFilter, this.value);
                }
            });

            refreshBtn.addEventListener('click', function() {
                fetchExploits();
            });

            setInterval(fetchExploits, 60000);

            fetchExploits();

        })();
    </script>
</body>
</html>
